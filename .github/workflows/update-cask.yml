name: Update cask
run-name: Cask for Magnetite ${{ inputs.version || '(latest release)' }}

# Takes the cask of a published Magnetite release into this tap: downloads
# the release's magnetite.rb, checks it against the release's checksums,
# installs it once on a Mac and once on Linux the way a user would
# (install.yml), and commits it as Casks/magnetite.rb. Run it after
# publishing a release (Actions → Update cask → Run workflow). It refuses
# drafts and pre-releases, and an app Gatekeeper would not open.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the "v" (0.2.0); empty for the latest release
        default: ""

permissions: {}

concurrency:
  group: update-cask
  cancel-in-progress: false

env:
  BROWSER_REPO: magnetite-browser/magnetite
  CASK: magnetite-browser/magnetite/magnetite

jobs:
  check:
    name: Check against the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Find the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.version }}
        run: |
          if [[ -n "$WANTED" ]]; then
            [[ "$WANTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Not a version (0.2.0): $WANTED"; exit 1; }
            tag="v$WANTED"
          else
            # "Latest" on GitHub is never a draft or a pre-release.
            tag="$(gh release view --repo "$BROWSER_REPO" --json tagName --jq .tagName)"
          fi
          state="$(gh release view "$tag" --repo "$BROWSER_REPO" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
          [[ "$state" == "false false" ]] || { echo "::error::$tag is a draft or a pre-release; the tap carries published releases only"; exit 1; }
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

      - name: Download the cask and the checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$BROWSER_REPO" --dir "$RUNNER_TEMP/release" \
            --pattern magnetite.rb --pattern SHA256SUMS

      # The cask must name this version and the checksums the release lists
      # for its macOS zips and Linux AppImages; anything else is not this
      # release's cask.
      - name: Check the cask against the release
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cask="$RUNNER_TEMP/release/magnetite.rb" sums="$RUNNER_TEMP/release/SHA256SUMS"
          grep -qx "  version \"$VERSION\"" "$cask" || { echo "::error::The cask is not for $VERSION"; exit 1; }
          # The cask's sha256 key for each package.
          for pair in \
            "arm Magnetite-$VERSION-macos-aarch64.zip" \
            "intel Magnetite-$VERSION-macos-x86_64.zip" \
            "arm64_linux magnetite-$VERSION-linux-aarch64.AppImage" \
            "x86_64_linux magnetite-$VERSION-linux-x86_64.AppImage"; do
            read -r key file <<<"$pair"
            want="$(awk -v f="$file" '$2 == f || $2 == "*" f { print $1 }' "$sums")"
            [[ -n "$want" ]] || { echo "::error::SHA256SUMS does not list $file"; exit 1; }
            grep -Eq "(^|[[:space:]])$key:[[:space:]]+\"$want\"" "$cask" || { echo "::error::The cask's checksum for $file is not the release's"; exit 1; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cask
          path: ${{ runner.temp }}/release/magnetite.rb
          if-no-files-found: error

  install:
    name: Install
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/install.yml
    with:
      artifact: cask

  commit:
    name: Commit
    needs: [check, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cask
          path: Casks

      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if git diff --quiet -- Casks/magnetite.rb && git ls-files --error-unmatch Casks/magnetite.rb >/dev/null 2>&1; then
            echo "The tap has this cask already."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/magnetite.rb
          git commit -m "magnetite $VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
